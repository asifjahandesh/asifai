<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0b1710" />
      <stop offset="60%" stop-color="#050a07" />
      <stop offset="100%" stop-color="#020403" />
    </radialGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="18" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Glow for inner elements -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradients -->
    <linearGradient id="neonGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>

    <linearGradient id="leftLegGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="70%" stop-color="#dcfce7" />
      <stop offset="100%" stop-color="#bbf7d0" />
    </linearGradient>

    <linearGradient id="rightLegGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="60%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>

    <linearGradient id="swooshGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#86efac" />
      <stop offset="50%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
  </defs>

  <!-- Dark Background Badge -->
  <rect width="512" height="512" rx="115" fill="url(#bgGlow)" />

  <!-- Outer Neon Rounded Border with Glow -->
  <rect x="52" y="52" width="408" height="408" rx="88" stroke="#22c55e" stroke-width="14" fill="none" filter="url(#neonGlow)" />
  <rect x="52" y="52" width="408" height="408" rx="88" stroke="#86efac" stroke-width="6" fill="none" opacity="0.9" />

  <!-- Circuit nodes extending from top right -->
  <!-- Circuit 1 -->
  <path d="M 295 185 L 340 145" stroke="#4ade80" stroke-width="6" stroke-linecap="round" filter="url(#subtleGlow)" />
  <circle cx="348" cy="138" r="11" fill="none" stroke="#4ade80" stroke-width="6" filter="url(#subtleGlow)" />

  <!-- Circuit 2 (middle angled) -->
  <path d="M 320 220 L 350 185 L 375 185" stroke="#4ade80" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#subtleGlow)" />
  <circle cx="386" cy="185" r="11" fill="none" stroke="#4ade80" stroke-width="6" filter="url(#subtleGlow)" />

  <!-- Circuit 3 (lower right) -->
  <path d="M 335 255 L 370 220" stroke="#4ade80" stroke-width="6" stroke-linecap="round" filter="url(#subtleGlow)" />
  <circle cx="379" cy="211" r="11" fill="none" stroke="#4ade80" stroke-width="6" filter="url(#subtleGlow)" />

  <!-- Stylized Letter 'A' -->
  <!-- Right Leg with Cyber Notch -->
  <path d="M 256 122 L 358 350 L 290 350 L 250 326 L 314 326 L 256 186 Z" fill="url(#rightLegGrad)" />

  <!-- Left Leg (Bright / White-Green) -->
  <path d="M 256 122 L 154 350 L 222 350 L 256 262 L 274 216 Z" fill="url(#leftLegGrad)" filter="url(#subtleGlow)" />

  <!-- Top Apex Highlight -->
  <path d="M 244 146 Q 256 120 268 146 L 274 162 L 238 162 Z" fill="#ffffff" />

  <!-- Dynamic Curved Orbital Swoosh -->
  <path d="M 136 290 C 130 240 170 198 226 190 C 270 184 316 200 366 226 C 304 238 238 274 178 304 C 158 314 140 308 136 290 Z" fill="url(#swooshGrad)" filter="url(#subtleGlow)" />
</svg>
