<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASIF AI | Excel Automation Agent</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js" type="text/javascript"></script>
  <link rel="stylesheet" href="taskpane.css" />
</head>
<body>
  <!-- Header -->
  <header class="app-header">
    <div class="brand">
      <div class="brand-icon">
        <img src="assets/icon.svg" alt="ASIF AI" />
      </div>
      <div>
        <div class="brand-name">ASIF AI</div>
        <div class="brand-sub">AUTONOMOUS AGENT</div>
      </div>
    </div>
    <div class="header-actions">
      <!-- Mode Toggle: Chat vs Agent Mode -->
      <div class="mode-toggle">
        <button id="modeChat" class="mode-btn" title="Chat & Formula Assistant">Chat</button>
        <button id="modeAgent" class="mode-btn active" title="Autonomous Excel Automation Agent">⚡ Agent</button>
      </div>
      <button id="btnNewChat" class="btn-icon" title="New Session">+ New</button>
    </div>
  </header>

  <!-- Excel Workbook & Active Selection Status Bar -->
  <div class="excel-context-bar">
    <div class="context-info">
      <span class="context-label">Context:</span>
      <span id="currentSelection" class="context-tag">Scanning workbook...</span>
    </div>
    <button id="btnScanWorkbook" class="btn-pill" title="Read all worksheets & schema">Scan Workbook</button>
  </div>

  <!-- Agent Quick Commands Toolbar -->
  <div class="toolbar-actions">
    <button id="btnMgmtSummary" class="action-btn" title="Create Executive Management Summary">
      <span>📊</span> Management Summary
    </button>
    <button id="btnVarianceReport" class="action-btn" title="Highlight Negative Variances">
      <span>🎯</span> Variance &amp; KPIs
    </button>
    <button id="btnFindDuplicates" class="action-btn" title="Find duplicate entries or orders">
      <span>🔍</span> Audit &amp; Duplicates
    </button>
  </div>

  <!-- Chat / Content Area -->
  <main id="chatContainer" class="chat-container">
    <div id="welcomeBox" class="welcome-box">
      <div class="welcome-title">ASIF AI Autonomous Agent</div>
      <div class="welcome-desc">
        Direct ASIF AI using natural language. It will inspect your workbook, formulate an execution plan, and perform operations directly inside Excel via Office.js.
      </div>
      <div class="welcome-prompts">
        <button class="prompt-chip" data-prompt="Analyze all data in this workbook. Create a new sheet named Management Summary. Show total production, order-wise performance, monthly trends, top 10 orders, exceptions and charts.">
          🚀 <strong>Full Management Summary:</strong> KPIs, order performance, trend charts
        </button>
        <button class="prompt-chip" data-prompt="Analyze the active worksheet. Highlight negative variances, compute efficiency %, and generate a variance summary table.">
          🎯 <strong>Textile / RMG Planning:</strong> Variance, efficiency &amp; risk audit
        </button>
        <button class="prompt-chip" data-prompt="Scan for duplicate orders or duplicate rows in this sheet and create an Audit Report.">
          🔍 <strong>Data Audit:</strong> Detect duplicates, missing data &amp; anomalies
        </button>
      </div>
    </div>
  </main>

  <!-- Notification Bar -->
  <div id="notificationArea" style="padding: 0 14px;"></div>

  <!-- Input Area -->
  <footer class="input-section">
    <div class="input-box">
      <textarea id="userInput" placeholder="Instruct ASIF AI (e.g. 'Create Management Summary with charts')..."></textarea>
      <div class="input-footer">
        <div class="model-tag">
          <span>✨</span> Gridex Smart <span id="agentModeIndicator" class="agent-mode-tag">AGENT ACTIVE</span>
        </div>
        <button id="btnSend" class="btn-send" title="Execute command" disabled>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="19" x2="12" y2="5"></line>
            <polyline points="5 12 12 5 19 12"></polyline>
          </svg>
        </button>
      </div>
    </div>
  </footer>

  <script src="taskpane.js"></script>
</body>
</html>
